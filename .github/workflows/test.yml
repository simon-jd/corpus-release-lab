name: Contract tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q --junitxml=evidence/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-tests
          path: evidence/ci-tests.xml
